name: balansoved_mobile
description: "Balansoved mobile app."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  android_notification_icons: ^0.0.1
  auto_route: 10.1.0+1
  card_loading: ^0.3.2
  collection: ^1.18.0
  dartz: ^0.10.1
  dio: ^5.8.0+1
  dio_web_adapter: ^2.1.0
  equatable: ^2.0.7
  excel: ^2.1.0
  extended_text: ^15.0.2
  extended_text_field: ^16.0.2
  file_picker: ^8.1.6
  file_saver: ^0.3.0
  font_awesome_flutter: ^10.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dropzone: ^4.0.1
  flutter_quill: ^11.4.1
  flutter_quill_extensions: ^11.0.0
  flutter_rustore_push: ^6.10.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_switch: ^0.3.2
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  http: ^1.2.2
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  logger: ^2.5.0
  mime: ^2.0.0
  package_info_plus: ^8.0.0
  permission_handler: ^12.0.1
  responsive_builder: ^0.7.1
  shared_preferences: ^2.5.3
  styled_widget: ^0.4.1
  syncfusion_flutter_datagrid: ^31.1.19
  table_calendar: ^3.2.0
  talker: ^4.9.3
  talker_bloc_logger: ^4.9.3
  talker_dio_logger: ^4.9.3
  talker_flutter: ^4.9.3
  translit: ^2.0.2
  url_launcher: ^6.2.5
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.13.0
  xml: ^6.3.0
  yandex_mapkit: ^4.1.0

dev_dependencies:
  auto_route_generator: 10.1.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/balansoved_png_white.png
    - assets/balansoved_white_on_black.png
    - assets/balansoved_white_on_png_BIG.png
    - assets/transparent_background.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/balansoved_white_on_black.png"
  adaptive_icon_foreground: "assets/balansoved_png_white.png"
  adaptive_icon_background: "assets/transparent_background.png"

android_notification_icons:
  image_path: "assets/balansoved_png_white.png"
  icon_name: "ic_notification"
